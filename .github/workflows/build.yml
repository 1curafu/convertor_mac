name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write   # only to publish UI snapshots to the ui-snapshots branch
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build app bundle (with ffmpeg)
        run: |
          set -o pipefail
          scripts/build_app.sh 2>&1 | tee build.log || { echo "::group::Errors"; grep -E ": error:" build.log | sort -u; echo "::endgroup::"; exit 1; }
      - name: Check bundled ffmpeg has the encoders we use
        run: |
          FF=build/Convertor.app/Contents/MacOS/ffmpeg
          $FF -hide_banner -encoders > encoders.txt
          for enc in libx264 libmp3lame libvorbis libopus libvpx-vp9 libwebp wmav2 wmv2 flac; do
            grep -q " $enc " encoders.txt && echo "✓ $enc" || { echo "✗ $enc missing"; exit 1; }
          done
          grep -E "av1|aom" encoders.txt || echo "no AV1 encoder (AVIF output unavailable)"
      - name: Run conversion tests
        run: |
          export CONVERTOR_FFMPEG="$PWD/build/Convertor.app/Contents/MacOS/ffmpeg"
          export CONVERTOR_TEST_OUT="$RUNNER_TEMP/convertor-out"
          export CONVERTOR_SNAPSHOT_OUT="$RUNNER_TEMP/ui-snapshots"
          set -o pipefail
          swift test 2>&1 | tee test.log || { grep -E ": error:|failed \\(|XCTAssert|error:" test.log | sort -u | head -80; exit 1; }
      - name: Validate Office/ODF/EPUB outputs with independent libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet openpyxl python-pptx python-docx
          "$RUNNER_TEMP/venv/bin/python" scripts/validate_outputs.py "$RUNNER_TEMP/convertor-out"
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
          if-no-files-found: warn
      - name: Publish UI snapshots to the ui-snapshots branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/ui-snapshots" 2>/dev/null || exit 0
          git init -q -b ui-snapshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "UI snapshots for ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-snapshots
